<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>WONI MUSIC SHOW · 무대의상 스튜디오</title>
<style>
*{box-sizing:border-box}body{margin:0;color:white;background:#150d35;font-family:Arial,'Noto Sans',sans-serif}body:before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 15% 0,#7c24b677,transparent 50%),radial-gradient(ellipse at 90% 20%,#166bca66,transparent 50%)}header{position:relative;padding:24px 28px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff22}.brand{font-size:13px;letter-spacing:3px;color:#f9a3e4}h1{font-size:clamp(22px,3vw,42px);margin:8px 0}header p{color:#c5b7dd;font-size:14px;margin:0}.live{border:1px solid #e87de3;border-radius:30px;padding:10px 18px;color:#ffd1f6;box-shadow:0 0 22px #ff44c344}main{position:relative;display:grid;grid-template-columns:220px 1fr;gap:20px;padding:22px;max-width:1800px;margin:auto}aside{background:#ffffff0c;border:1px solid #ffffff20;border-radius:20px;padding:18px;height:fit-content}h2{font-size:18px;margin:0 0 16px}.hint{font-size:12px;color:#cbbedd;line-height:1.7}.items{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.item{background:#fff0fb;color:#402254;border:0;border-radius:14px;min-height:85px;cursor:grab;font-size:34px;touch-action:none}.item span{display:block;font-size:11px;margin:5px}.shirt{grid-column:span 2;background:linear-gradient(135deg,#ffe3f4,#d9eaff)}.teams{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.team{--tone:#fa4caa;--light:#fbd3ea;background:linear-gradient(180deg,color-mix(in srgb,var(--tone) 24%,#23133f),#201133);border:2px solid var(--tone);box-shadow:0 0 24px color-mix(in srgb,var(--tone) 20%,transparent);border-radius:22px;overflow:hidden}.teamhead{padding:14px;display:flex;align-items:center;gap:7px}.num{background:var(--tone);font-size:20px;font-weight:bold;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;flex-shrink:0}input{background:#ffffff15;color:white;border:1px solid #ffffff22;border-radius:9px;width:100%;font-size:14px;padding:9px 6px}input::placeholder{color:#ddd2e6}.stage{height:420px;position:relative;overflow:hidden;background:radial-gradient(ellipse at center,var(--light),color-mix(in srgb,var(--tone) 45%,#321847));touch-action:none}.stage:before{content:'✧      ☆      ✧\A    ✧       ♡\A ☆       ✧\A     ♡        ☆';white-space:pre;position:absolute;inset:10px;color:#ffffff90;font-size:37px;line-height:2.3;text-align:center;pointer-events:none}.stage.over{outline:5px dashed white;outline-offset:-8px}.character{width:100%;height:100%;position:relative;pointer-events:none;filter:drop-shadow(0 8px 5px #35173f44)}.accessory{position:absolute;font-size:48px;line-height:1;cursor:grab;touch-action:none;transform:translate(-50%,-50%);filter:drop-shadow(0 3px 2px #0003);user-select:none}.controls{padding:12px;display:flex;flex-wrap:wrap;gap:6px}button{font:inherit}.small{background:#ffffff16;color:white;border:1px solid #ffffff25;border-radius:8px;padding:7px 9px;cursor:pointer;font-size:12px}.small:hover,.small[aria-pressed=true]{background:var(--tone,#9e52ca);border-color:white}.score{display:flex;justify-content:space-between;align-items:center;margin:0 12px 12px;border-radius:12px;padding:10px;background:#0c092b88;color:var(--light);font-size:13px}.score output{font-size:22px;letter-spacing:3px;font-weight:bold}footer{position:relative;color:#b5a6ca;font-size:12px;text-align:center;padding:5px 20px 24px}#notice{min-height:20px;color:#ffd0ec;margin-top:12px;font-size:12px}#ghost{position:fixed;pointer-events:none;z-index:100;font-size:48px;transform:translate(-50%,-50%)}@media(max-width:1050px){.teams{grid-template-columns:repeat(2,minmax(0,1fr))}.stage{height:420px}}@media(max-width:600px){header{padding:18px}.live{display:none}main{display:block;padding:12px}aside{margin-bottom:16px}.items{grid-template-columns:repeat(5,1fr)}.shirt{grid-column:span 1}.item{min-height:65px;font-size:28px}.item span{font-size:10px}.teams{gap:9px}.stage{height:310px}.teamhead{padding:8px}.num{width:24px;height:24px;font-size:14px}input{font-size:12px}.controls{padding:8px}.accessory{font-size:38px}}
</style>
<header><div><div class="brand">✦ WONI MUSIC SHOW</div><h1>원희의 무대의상을 완성하라!</h1><p>드래그 한 번으로 완성하는 우리 팀의 무대 ✨</p></div><div class="live">● LIVE · DRESS UP</div></header>
<main><aside><h2>👕 의상 & 액세서리</h2><p class="hint">셔츠를 캐릭터에 놓으면 팀 색상으로 입어요. 액세서리는 원하는 위치에 놓고 다시 움직여 보세요.</p><div class="items" id="items"></div><p class="hint">터치도 가능해요.<br>아이템 선택 → 캐릭터 클릭으로도 배치할 수 있어요.<br>액세서리를 두 번 누르면 삭제돼요.</p><button class="small" id="reset">전체 초기화</button><div id="notice" role="status" aria-live="polite"></div></aside><section class="teams" aria-label="4팀 스타일링 무대" id="teams"></section></main><footer>MAKE YOUR OWN STAGE · 변경 내용은 이 브라우저에 자동 저장됩니다.</footer>
<script>
const colors=['#fa4caa','#20baff','#ffba28','#aa62ff'],lights=['#ffdaed','#d3f3ff','#fff0b9','#ecdaff'];
const catalog=[['shirt','👕','팀 셔츠'],['🎧','🎧','헤드폰'],['🧢','🧢','모자'],['🎀','🎀','리본'],['⭐','⭐','별'],['👜','👜','가방'],['🎤','🎤','마이크'],['🕶️','🕶️','선글라스'],['💖','💖','하트']];
const fresh=()=>Array.from({length:4},(_,i)=>({name:'',base:i%2?'black':'white',shirt:false,accessories:[]}));let state;try{state=JSON.parse(localStorage.getItem('woni-studio-v1'));if(!Array.isArray(state)||state.length!==4)throw 0}catch{state=fresh()}let selected=null,drag=null;
const save=()=>{try{localStorage.setItem('woni-studio-v1',JSON.stringify(state))}catch{notice('저장 공간이 부족해 자동 저장할 수 없어요.')}};const notice=t=>document.querySelector('#notice').textContent=t;
function character(t,i){const dark=t.base==='black',fur=dark?'#35323e':'#fffdf7',edge=dark?'#171321':'#b7a8bf',shirt=t.shirt?colors[i]:fur;return `<svg class="character" viewBox="0 0 240 420" role="img" aria-label="${dark?'검정':'흰색'} 캐릭터${t.shirt?' 팀 셔츠 착용':''}"><ellipse cx="120" cy="386" rx="78" ry="12" fill="#49305a33"/><path d="M83 282L75 365Q64 388 96 386L118 304L137 385Q173 394 164 367L155 279" fill="${fur}" stroke="${edge}" stroke-width="3"/><path d="M83 202Q55 210 42 268Q40 281 53 284Q64 285 84 248M156 202Q182 208 197 267Q203 283 189 285Q178 287 155 246" fill="${shirt}" stroke="${edge}" stroke-width="3"/><path d="M84 194Q120 184 155 194L169 294Q120 315 71 294Z" fill="${shirt}" stroke="${edge}" stroke-width="3"/>${t.shirt?'<path d="M99 194L120 221L140 194M120 221V302" fill="none" stroke="#ffffffaa" stroke-width="3"/><circle cx="128" cy="244" r="2" fill="white"/><circle cx="128" cy="264" r="2" fill="white"/><path d="M137 234h18v19h-18z" fill="#ffffff33"/>':''}<path d="M64 91L49 37Q46 20 64 28L99 62M143 63L177 27Q192 17 189 39L177 93" fill="${fur}" stroke="${edge}" stroke-width="3"/><path d="M64 59L70 84L84 72M163 72L178 50L173 85" fill="#ed9fbf"/><ellipse cx="120" cy="129" rx="79" ry="75" fill="${fur}" stroke="${edge}" stroke-width="3"/><ellipse cx="89" cy="123" rx="7" ry="10" fill="${dark?'#fff':'#342438'}"/><ellipse cx="150" cy="123" rx="7" ry="10" fill="${dark?'#fff':'#342438'}"/><ellipse cx="73" cy="146" rx="14" ry="8" fill="#ef8fb4"/><ellipse cx="166" cy="146" rx="14" ry="8" fill="#ef8fb4"/><path d="M114 140Q120 134 126 140L120 146Z" fill="#e58ba8"/><path d="M120 146Q110 159 103 149M120 146Q130 159 137 149" fill="none" stroke="${dark?'#fff':'#342438'}" stroke-width="3" stroke-linecap="round"/></svg>`}
function render(){document.querySelector('#teams').innerHTML=state.map((t,i)=>`<article class="team" style="--tone:${colors[i]};--light:${lights[i]}"><div class="teamhead"><span class="num">${i+1}</span><input data-team="${i}" aria-label="${i+1}팀 이름" placeholder="${i+1}팀 이름 입력" maxlength="20"></div><div class="stage" data-team="${i}" tabindex="0" role="group" aria-label="${i+1}팀 아이템 배치 영역">${character(t,i)}${t.accessories.map((a,j)=>`<span class="accessory" data-index="${j}" style="left:${a.x}%;top:${a.y}%" role="button" tabindex="0" aria-label="${a.icon} 액세서리. 방향키로 이동, Delete로 삭제">${a.icon}</span>`).join('')}</div><div class="controls"><button class="small" data-action="white" data-team="${i}" aria-pressed="${t.base==='white'}">흰 캐릭터</button><button class="small" data-action="black" data-team="${i}" aria-pressed="${t.base==='black'}">검정 캐릭터</button><button class="small" data-action="undress" data-team="${i}">셔츠 벗기</button><button class="small" data-action="clear" data-team="${i}">소품 비우기</button></div><div class="score"><span>✦ STYLING</span><output>${String((t.shirt?100:0)+t.accessories.length*10).padStart(4,'0')}</output></div></article>`).join('');document.querySelectorAll('input').forEach(e=>e.value=state[e.dataset.team].name)}
document.querySelector('#items').innerHTML=catalog.map(([id,icon,label])=>`<button class="item ${id==='shirt'?'shirt':''}" data-item="${id}" aria-label="${label}">${icon}<span>${label}</span></button>`).join('');render();
function place(id,stage,x,y,index){const i=+stage.dataset.team,r=stage.getBoundingClientRect();if(id==='shirt')state[i].shirt=true;else{const a={icon:id,x:Math.max(5,Math.min(95,(x-r.left)/r.width*100)),y:Math.max(5,Math.min(95,(y-r.top)/r.height*100))};if(index!=null)state[i].accessories[index]=a;else state[i].accessories.push(a)}save();render();notice(id==='shirt'?`${i+1}팀이 셔츠를 입었어요!`:'액세서리를 배치했어요.');}
document.addEventListener('pointerdown',e=>{const item=e.target.closest('[data-item]'),acc=e.target.closest('.accessory');if(!item&&!acc)return;const stage=acc?.closest('.stage');drag={id:item?item.dataset.item:state[+stage.dataset.team].accessories[+acc.dataset.index].icon,stage,index:acc?+acc.dataset.index:null,x:e.clientX,y:e.clientY,moved:false};});
document.addEventListener('pointermove',e=>{if(!drag)return;if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<6&&!drag.moved)return;drag.moved=true;e.preventDefault();let ghost=document.querySelector('#ghost');if(!ghost){ghost=document.createElement('div');ghost.id='ghost';ghost.textContent=drag.id==='shirt'?'👕':drag.id;document.body.append(ghost)}ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';document.querySelectorAll('.stage').forEach(s=>s.classList.toggle('over',s===document.elementFromPoint(e.clientX,e.clientY)?.closest('.stage')))}, {passive:false});
document.addEventListener('pointerup',e=>{if(!drag)return;const d=drag;drag=null;document.querySelector('#ghost')?.remove();document.querySelectorAll('.over').forEach(s=>s.classList.remove('over'));if(!d.moved)return;const s=document.elementFromPoint(e.clientX,e.clientY)?.closest('.stage');if(s){if(d.stage&&s!==d.stage){state[+d.stage.dataset.team].accessories.splice(d.index,1);place(d.id,s,e.clientX,e.clientY,null)}else place(d.id,s,e.clientX,e.clientY,d.index)}suppressClick=true;setTimeout(()=>suppressClick=false,0)});let suppressClick=false;
document.addEventListener('pointercancel',()=>{drag=null;document.querySelector('#ghost')?.remove();document.querySelectorAll('.over').forEach(s=>s.classList.remove('over'))});
document.addEventListener('click',e=>{if(suppressClick)return;const item=e.target.closest('[data-item]');if(item){selected=item.dataset.item;notice(`${item.innerText.trim()} 선택됨 · 원하는 팀 위치를 눌러주세요.`);return}const action=e.target.closest('[data-action]');if(action){const t=state[+action.dataset.team],a=action.dataset.action;if(a==='white'||a==='black')t.base=a;if(a==='clear')t.accessories=[];if(a==='undress')t.shirt=false;save();render();return}const s=e.target.closest('.stage');if(s&&selected&&!e.target.closest('.accessory')){place(selected,s,e.clientX,e.clientY,null);selected=null}});
document.addEventListener('dblclick',e=>{const a=e.target.closest('.accessory');if(a){state[+a.closest('.stage').dataset.team].accessories.splice(+a.dataset.index,1);save();render()}});
document.addEventListener('keydown',e=>{const a=e.target.closest('.accessory'),s=e.target.closest('.stage');if(a){const t=state[+s.dataset.team],v=t.accessories[+a.dataset.index];if(e.key==='Delete'||e.key==='Backspace'){t.accessories.splice(+a.dataset.index,1);save();render();return}const delta={ArrowLeft:[-2,0],ArrowRight:[2,0],ArrowUp:[0,-2],ArrowDown:[0,2]}[e.key];if(delta){e.preventDefault();v.x=Math.max(5,Math.min(95,v.x+delta[0]));v.y=Math.max(5,Math.min(95,v.y+delta[1]));a.style.left=v.x+'%';a.style.top=v.y+'%';save()}}else if(s&&selected&&(e.key==='Enter'||e.key===' ')){e.preventDefault();const r=s.getBoundingClientRect();place(selected,s,r.left+r.width/2,r.top+r.height/2,null);selected=null}});
document.addEventListener('input',e=>{if(e.target.matches('input')){state[+e.target.dataset.team].name=e.target.value;save()}});document.querySelector('#reset').onclick=()=>{if(confirm('모든 팀의 의상과 액세서리를 초기화할까요?')){state=fresh();save();render()}};
</script></html>
